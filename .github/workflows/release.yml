name: Release

# After CI passes on a push to main, publish the next YYYY.M.N GitHub Release.
# Self-hosted installations see it in their daily update check.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Next version and notes
        id: next
        run: echo "tag=$(node scripts/next-release.mjs "$SHA" "$RUNNER_TEMP/notes.md")" >> "$GITHUB_OUTPUT"
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
      - name: Publish
        if: steps.next.outputs.tag != ''
        run: gh release create "$TAG" --target "$SHA" --title "amable $TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
      # Optional: a hosted offering tracking this repo as a submodule gets a
      # `product-release` repository_dispatch (variable DOWNSTREAM_REPO = owner/name,
      # secret DOWNSTREAM_DISPATCH_TOKEN with contents:write on it).
      - name: Notify downstream
        if: steps.next.outputs.tag != '' && vars.DOWNSTREAM_REPO != ''
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::DOWNSTREAM_DISPATCH_TOKEN not set"; exit 0; fi
          gh api "repos/$REPO/dispatches" -f event_type=product-release -f "client_payload[tag]=$TAG"
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
          REPO: ${{ vars.DOWNSTREAM_REPO }}
          TAG: ${{ steps.next.outputs.tag }}
