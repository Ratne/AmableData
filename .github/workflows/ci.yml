name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The names check also scans commit messages.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Names rule
        run: pnpm check:names
        env:
          # Optional extra terms in clear text, kept out of the repository.
          FORBIDDEN_NAMES: ${{ secrets.FORBIDDEN_NAMES }}
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Dependency audit (production dependencies, non-blocking)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
